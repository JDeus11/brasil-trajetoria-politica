<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capítulo 3</title>
<style>
  :root {
    --bg: #14110d;
    --paper: #ece5d3;
    --ink: #f2ead9;
    --muted: #b8ab8e;
    --accent: #a9843f;
    --accent-dim: #6e572c;
    --line: rgba(242,234,217,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    overflow: hidden;
  }
  .app {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
  }
  .stage {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #000;
  }
  .stage img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .stage img.active { opacity: 1; }
  .vignette {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,8,6,0.92) 0%, rgba(10,8,6,0.55) 22%, rgba(10,8,6,0) 46%),
                linear-gradient(to bottom, rgba(10,8,6,0.55) 0%, rgba(10,8,6,0) 18%);
    pointer-events: none;
  }
  .kicker {
    position: absolute; top: 28px; left: 36px; right: 36px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: Georgia, serif;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-size: 13px;
    z-index: 3;
  }
  .kicker .book {
    color: var(--accent);
    font-style: italic;
  }
  .caption-wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 48px 30px;
    z-index: 3;
  }
  .caption-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 10px;
    max-width: 900px;
  }
  .caption-text {
    font-size: 17px;
    line-height: 1.62;
    color: var(--paper);
    max-width: 780px;
    min-height: 3.2em;
  }
  .caption-text .word { opacity: 0.38; transition: opacity 0.15s linear; }
  .caption-text .word.said { opacity: 1; }
  .transport {
    background: #0d0b08;
    border-top: 1px solid var(--line);
    padding: 14px 36px 18px;
    display: flex; align-items: center; gap: 18px;
  }
  .btn {
    background: none; border: 1.5px solid var(--accent-dim);
    color: var(--ink); border-radius: 999px;
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px;
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--accent); background: rgba(169,132,63,0.12); }
  .btn.play { width: 54px; height: 54px; font-size: 20px; border-color: var(--accent); }
  .progress-row { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .dots { display: flex; gap: 6px; }
  .dot {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--accent-dim); overflow: hidden;
    position: relative; cursor: pointer;
  }
  .dot .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%; background: var(--accent);
  }
  .dot.done .fill { width: 100%; }
  .meta-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); letter-spacing: 0.03em;
  }
  select {
    background: #1c180f; color: var(--ink);
    border: 1px solid var(--accent-dim); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; max-width: 190px;
    font-family: inherit;
  }
  .hint {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,8,6,0.72); cursor: pointer;
    color: var(--ink); font-size: 15px; text-align: center; padding: 20px;
  }
  .hint span { border: 1px solid var(--accent); border-radius: 999px; padding: 16px 26px; background: rgba(20,17,13,0.7); }
  .hidden { display: none !important; }
  @media (max-width: 720px) {
    .caption-title { font-size: 19px; }
    .caption-text { font-size: 14.5px; }
    .caption-wrap { padding: 0 20px 20px; }
    .kicker { left: 18px; right: 18px; font-size: 11px; }
    .transport { padding: 10px 14px 14px; gap: 10px; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="vignette"></div>
    <div class="kicker">
      <span><span class="book">Brasil: Trajetória Política</span> — Capítulo 3</span>
      <span id="slideCounter">1 / 8</span>
    </div>
    <div class="caption-wrap">
      <div class="caption-title" id="capTitle"></div>
      <div class="caption-text" id="capText"></div>
    </div>
    <div class="hint" id="startHint"><span>Toque para começar a narração ▸</span></div>
  </div>
  <div class="transport">
    <button class="btn" id="prevBtn" title="Anterior">◂</button>
    <button class="btn play" id="playBtn" title="Play/Pause">▶</button>
    <button class="btn" id="nextBtn" title="Próxima">▸</button>
    <div class="progress-row">
      <div class="dots" id="dots"></div>
      <div class="meta-row">
        <span id="statusText">Pronto</span>
        <span id="chapterProgress"></span>
      </div>
    </div>
  </div>
</div>

let currentIndex = 0;
let isPlaying = false;
let voices = [];
let selectedVoice = null;
let currentUtterance = null;
let wordSpans = [];

const stage = document.getElementById('stage');
const capTitle = document.getElementById('capTitle');
const capText = document.getElementById('capText');
const slideCounter = document.getElementById('slideCounter');
const chapterProgress = document.getElementById('chapterProgress');
const statusText = document.getElementById('statusText');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsWrap = document.getElementById('dots');
const startHint = document.getElementById('startHint');

let imgEls = [];

function buildStage() {
  SLIDES.forEach((s, i) => {
    const im = document.createElement('img');
    im.src = s.img;
    im.className = i === 0 ? 'active' : '';
    stage.insertBefore(im, stage.firstChild);
    imgEls.push(im);
  });
  SLIDES.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.innerHTML = '<div class="fill"></div>';
    d.addEventListener('click', () => { stopSpeaking(); goTo(i); if (isPlaying) speakCurrent(); });
    dotsWrap.appendChild(d);
  });
}

function renderWords(text) {
  capText.innerHTML = '';
  wordSpans = [];
  const words = text.split(/(\\s+)/);
  words.forEach(w => {
    if (w.trim() === '') { capText.appendChild(document.createTextNode(w)); return; }
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    capText.appendChild(span);
    wordSpans.push(span);
  });
}

function goTo(i) {
  currentIndex = ((i % SLIDES.length) + SLIDES.length) % SLIDES.length;
  imgEls.forEach((im, idx) => im.classList.toggle('active', idx === currentIndex));
  const s = SLIDES[currentIndex];
  capTitle.textContent = s.title;
  renderWords(s.text);
  slideCounter.textContent = (currentIndex + 1) + ' / ' + SLIDES.length;
  chapterProgress.textContent = s.title;
  document.querySelectorAll('.dot').forEach((d, idx) => {
    d.classList.toggle('done', idx < currentIndex);
    d.querySelector('.fill').style.width = idx === currentIndex ? '0%' : (idx < currentIndex ? '100%' : '0%');
  });
}

function populateVoices() {
  const all = window.speechSynthesis.getVoices();
  const grandpaPt = all.find(v => /grandpa/i.test(v.name) && v.lang && v.lang.toLowerCase().startsWith('pt'));
  const grandpaAny = all.find(v => /grandpa/i.test(v.name));
  if (grandpaPt) {
    selectedVoice = grandpaPt;
  } else if (grandpaAny) {
    selectedVoice = grandpaAny;
  } else {
    const ptVoice = all.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
    selectedVoice = ptVoice || all[0] || null;
    statusText.textContent = 'Voz "Grandpa" (PT-BR) não encontrada neste aparelho — usando a voz padrão disponível';
  }
}

if ('speechSynthesis' in window) {
  populateVoices();
  window.speechSynthesis.onvoiceschanged = populateVoices;
} else {
  statusText.textContent = 'Este navegador não suporta narração por voz (Web Speech API)';
}

function stopSpeaking() {
  window.speechSynthesis.cancel();
  currentUtterance = null;
}

function speakCurrent() {
  stopSpeaking();
  const s = SLIDES[currentIndex];
  const utter = new SpeechSynthesisUtterance(s.text);
  if (selectedVoice) utter.voice = selectedVoice;
  utter.lang = (selectedVoice && selectedVoice.lang) ? selectedVoice.lang : 'pt-BR';
  utter.rate = 0.98;
  utter.pitch = 0.92;
  currentUtterance = utter;
  statusText.textContent = 'Narrando…';

  let wordIdx = 0;
  utter.onboundary = (e) => {
    if (e.name === 'word' || e.charIndex !== undefined) {
      if (wordIdx < wordSpans.length) {
        wordSpans[wordIdx].classList.add('said');
        wordIdx++;
      }
    }
  };
  utter.onend = () => {
    wordSpans.forEach(w => w.classList.add('said'));
    if (isPlaying) {
      if (currentIndex < SLIDES.length - 1) {
        setTimeout(() => { goTo(currentIndex + 1); speakCurrent(); }, 550);
      } else {
        isPlaying = false;
        playBtn.textContent = '▶';
        statusText.textContent = 'Capítulo concluído';
      }
    }
  };
  utter.onerror = () => { statusText.textContent = 'Erro na síntese de voz — tente trocar a voz no seletor'; };
  window.speechSynthesis.speak(utter);
}

function togglePlay() {
  startHint.classList.add('hidden');
  if (isPlaying) {
    isPlaying = false;
    playBtn.textContent = '▶';
    stopSpeaking();
    statusText.textContent = 'Pausado';
  } else {
    isPlaying = true;
    playBtn.textContent = '❚❚';
    speakCurrent();
  }
}

playBtn.addEventListener('click', togglePlay);
startHint.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', () => { stopSpeaking(); goTo(currentIndex - 1); if (isPlaying) speakCurrent(); });
nextBtn.addEventListener('click', () => { stopSpeaking(); goTo(currentIndex + 1); if (isPlaying) speakCurrent(); });

buildStage();
goTo(0);
</script>
