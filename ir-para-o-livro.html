<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasil: Trajetória Política</title>
<style>
  :root{
    --ink:#0B2A5B;
    --paper:#FAF7EC;
    --stamp:#0E8A43;
    --brass:#B8860B;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background: var(--ink);
    font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;
  }
  .wrap{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  .flag-rule{ display:flex; height:4px; width:64px; margin-bottom:28px; border-radius:2px; overflow:hidden; }
  .flag-rule div{ flex:1; }
  .flag-rule .g{ background:#0E8A43; }
  .flag-rule .y{ background:#FFDF00; }
  .flag-rule .b{ background:#4A86E8; }
  .eyebrow{
    font-family:'Courier New',monospace; font-size:13px; letter-spacing:.12em;
    color: var(--brass); text-transform:uppercase; margin-bottom:16px;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;
    color: var(--paper);
    font-size:26px; line-height:1.35; font-weight:700;
    max-width:420px; margin-bottom:36px;
  }
  a.cta{
    display:inline-block;
    background: var(--stamp);
    color: var(--paper);
    font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;
    font-weight:700;
    font-size:22px;
    text-decoration:none;
    padding:26px 48px;
    border-radius:100px;
    box-shadow:0 18px 34px -14px rgba(14,138,67,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
    max-width:90vw;
  }
  a.cta:active{ transform:scale(0.97); }
  .sub{
    margin-top:22px;
    font-size:14px;
    color:rgba(250,247,238,0.6);
    max-width:340px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flag-rule"><div class="g"></div><div class="y"></div><div class="b"></div></div>
    <div class="eyebrow">Brasil: Trajetória Política</div>
    <h1>Isso foi só o resumo.<br>Entenda a fundo como o Brasil chegou até aqui.</h1>
    <a class="cta" href="https://jdeus11.github.io/brasil-trajetoria-politica/" target="_top">Quero entender a fundo →</a>
    <div class="sub">Livro + série narrada, da Independência à eleição de 2026</div>
  </div>
</body>
</html>
